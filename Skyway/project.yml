# XcodeGen spec. Generates Skyway.xcodeproj from the sources in this folder.
#
#   brew install xcodegen
#   cd Skyway && xcodegen generate && open Skyway.xcodeproj
#
# Nothing else in the repo depends on the generated project, so it stays out of
# version control — regenerate it whenever files are added.

name: Skyway
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # your 10-character Team ID
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Skyway:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Resources/Info.plist"
          - "Resources/Skyway.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.skyway
        INFOPLIST_FILE: Sources/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/Skyway.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Add USE_WEATHERKIT here to switch from Open-Meteo to WeatherKit.
        # Doing so also requires the WeatherKit capability on the App ID.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
    dependencies:
      - sdk: CarPlay.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: WeatherKit.framework
      - sdk: AVFoundation.framework

  SkywayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Skyway
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.skyway.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Skyway:
    build:
      targets:
        Skyway: all
    test:
      targets:
        - SkywayTests
    run:
      config: Debug
